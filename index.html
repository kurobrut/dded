<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Advanced Secure Password Generator</title>
  
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #3b82f6;
      --primary-dark: #1d4ed8;
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
      --bg-light: #f8fafc;
      --bg-dark: #0f172a;
      --surface-dark: #1e293b;
      --surface-light: #f1f5f9;
      --text-dark: #1e293b;
      --text-light: #ffffff;
      --border-light: #e2e8f0;
      --border-dark: #334155;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0ea5e9 100%);
      min-height: 100vh;
      padding: 20px;
      transition: background 0.3s ease;
    }

    body.light-mode {
      background: linear-gradient(135deg, #f0f4f8 0%, #f8fafc 50%, #e0f2fe 100%);
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    .app {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      animation: fadeIn 0.6s ease;
    }

    @media (max-width: 1024px) {
      .app {
        grid-template-columns: 1fr;
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 28px;
      backdrop-filter: blur(40px);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      color: white;
      transition: all 0.3s ease;
    }

    body.light-mode .card {
      background: rgba(255, 255, 255, 0.95);
      border-color: rgba(0, 0, 0, 0.1);
      color: var(--text-dark);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
    }

    .card:hover {
      border-color: rgba(59, 130, 246, 0.3);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
      padding-bottom: 20px;
      border-bottom: 2px solid rgba(255, 255, 255, 0.08);
    }

    body.light-mode .header {
      border-bottom-color: rgba(0, 0, 0, 0.08);
    }

    .title {
      font-size: 24px;
      font-weight: 800;
      background: linear-gradient(135deg, #fff 0%, #93c5fd 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    body.light-mode .title {
      background: linear-gradient(135deg, #0f172a 0%, #3b82f6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .theme-toggle {
      width: 50px;
      height: 50px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.08);
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      transition: all 0.3s ease;
    }

    body.light-mode .theme-toggle {
      background: rgba(59, 130, 246, 0.1);
      border-color: rgba(59, 130, 246, 0.2);
      color: var(--text-dark);
    }

    .theme-toggle:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: scale(1.05);
    }

    .section-title {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      margin-bottom: 14px;
      color: rgba(255, 255, 255, 0.5);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    body.light-mode .section-title {
      color: rgba(0, 0, 0, 0.5);
    }

    .section-title::before {
      content: '';
      width: 4px;
      height: 4px;
      background: var(--primary);
      border-radius: 50%;
    }

    .mode-selector {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 20px;
    }

    .mode-btn {
      padding: 10px;
      border-radius: 10px;
      border: 1.5px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.05);
      color: rgba(255, 255, 255, 0.8);
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    body.light-mode .mode-btn {
      border-color: rgba(0, 0, 0, 0.1);
      background: rgba(59, 130, 246, 0.05);
      color: var(--text-dark);
    }

    .mode-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: white;
    }

    .mode-btn:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
    }

    .password-display {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .password-input {
      flex: 1;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1.5px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.08);
      color: white;
      font-family: 'Monaco', 'Menlo', monospace;
      font-size: 14px;
      letter-spacing: 1px;
      outline: none;
      transition: all 0.3s ease;
    }

    body.light-mode .password-input {
      border-color: rgba(0, 0, 0, 0.1);
      background: rgba(59, 130, 246, 0.05);
      color: var(--text-dark);
    }

    .password-input:focus {
      background: rgba(255, 255, 255, 0.12);
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.2);
    }

    .icon-btn {
      width: 48px;
      height: 48px;
      padding: 0;
      border-radius: 12px;
      border: 1.5px solid rgba(255, 255, 255, 0.15);
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.2), rgba(59, 130, 246, 0.1));
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      transition: all 0.3s ease;
      flex-shrink: 0;
    }

    body.light-mode .icon-btn {
      border-color: rgba(0, 0, 0, 0.1);
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.15), rgba(59, 130, 246, 0.08));
    }

    .icon-btn:hover {
      background: linear-gradient(135deg, var(--primary), rgba(59, 130, 246, 0.8));
      border-color: var(--primary);
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(59, 130, 246, 0.3);
    }

    .control-group {
      margin-bottom: 20px;
    }

    .control-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-size: 13px;
      font-weight: 500;
    }

    input[type="range"] {
      width: 100%;
      height: 7px;
      border-radius: 10px;
      background: linear-gradient(90deg, rgba(255, 255, 255, 0.1), rgba(59, 130, 246, 0.2));
      outline: none;
      -webkit-appearance: none;
      appearance: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: linear-gradient(135deg, #60a5fa, #3b82f6);
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.5);
      transition: all 0.2s;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }

    .checkbox-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      cursor: pointer;
      font-size: 13px;
      transition: all 0.3s ease;
    }

    body.light-mode .checkbox-label {
      background: rgba(59, 130, 246, 0.05);
      border-color: rgba(0, 0, 0, 0.1);
    }

    .checkbox-label:hover {
      background: rgba(59, 130, 246, 0.15);
      border-color: var(--primary);
      transform: translateX(4px);
    }

    .checkbox-label input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: var(--primary);
    }

    .button-group {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .btn {
      flex: 1;
      padding: 12px 16px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      font-weight: 700;
      font-size: 13px;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--success), #15803d);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(34, 197, 94, 0.35);
    }

    .btn-secondary {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
    }

    .btn-secondary:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(59, 130, 246, 0.35);
    }

    .btn-small {
      padding: 8px 12px;
      font-size: 11px;
      flex: none;
    }

    .strength-bar {
      margin-bottom: 20px;
    }

    .strength-header {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .strength-bg {
      height: 10px;
      border-radius: 20px;
      background: rgba(0, 0, 0, 0.2);
      overflow: hidden;
      margin-bottom: 8px;
    }

    .strength-fill {
      height: 100%;
      transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
      border-radius: 20px;
    }

    .strength-label {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 15px;
    }

    .stat-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 10px;
      text-align: center;
    }

    body.light-mode .stat-card {
      background: rgba(59, 130, 246, 0.05);
      border-color: rgba(0, 0, 0, 0.1);
    }

    .stat-value {
      font-size: 16px;
      font-weight: 700;
      color: var(--primary);
    }

    .stat-label {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.6);
      margin-top: 4px;
    }

    body.light-mode .stat-label {
      color: rgba(0, 0, 0, 0.6);
    }

    .history-list {
      max-height: 300px;
      overflow-y: auto;
      background: rgba(255, 255, 255, 0.04);
      border-radius: 12px;
      padding: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    body.light-mode .history-list {
      background: rgba(59, 130, 246, 0.04);
      border-color: rgba(0, 0, 0, 0.1);
    }

    .history-item {
      padding: 10px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 8px;
      margin-bottom: 8px;
      font-family: 'Monaco', monospace;
      font-size: 11px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      animation: slideIn 0.3s ease;
    }

    body.light-mode .history-item {
      background: rgba(59, 130, 246, 0.08);
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(-10px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .history-password {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .history-time {
      font-size: 10px;
      opacity: 0.6;
      flex-shrink: 0;
    }

    .history-btn {
      background: rgba(59, 130, 246, 0.2);
      border: none;
      color: white;
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 10px;
      transition: all 0.2s;
    }

    .history-btn:hover {
      background: var(--primary);
    }

    .toast {
      position: fixed;
      bottom: 30px;
      right: 30px;
      padding: 14px 20px;
      border-radius: 12px;
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      font-size: 13px;
      font-weight: 600;
      animation: toastIn 0.4s ease;
      z-index: 1000;
    }

    .toast.success {
      background: linear-gradient(135deg, rgba(34, 197, 94, 0.2), rgba(34, 197, 94, 0.1));
      color: #86efac;
      border-color: rgba(34, 197, 94, 0.4);
    }

    .toast.error {
      background: linear-gradient(135deg, rgba(239, 68, 68, 0.2), rgba(239, 68, 68, 0.1));
      color: #fca5a5;
      border-color: rgba(239, 68, 68, 0.4);
    }

    @keyframes toastIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 640px) {
      .card {
        padding: 20px;
      }

      .mode-selector {
        grid-template-columns: 1fr;
      }

      .checkbox-group {
        grid-template-columns: 1fr;
      }

      .toast {
        bottom: 20px;
        right: 20px;
        left: 20px;
      }
    }

    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.4);
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    const { createApp, ref, computed, onMounted } = Vue;

    const app = createApp({
      template: `
        <div class="container">
          <div class="app">
            <!-- Generator Panel -->
            <div class="card">
              <div class="header">
                <h1 class="title">🔐 Password Pro</h1>
                <button class="theme-toggle" @click="toggleTheme" :title="isDark ? 'Light Mode' : 'Dark Mode'">
                  {{ isDark ? '☀️' : '🌙' }}
                </button>
              </div>

              <!-- Mode Selection -->
              <div class="mode-selector">
                <button class="mode-btn" :class="{ active: mode === 'random' }" @click="mode = 'random'">Random</button>
                <button class="mode-btn" :class="{ active: mode === 'passphrase' }" @click="mode = 'passphrase'">Passphrase</button>
                <button class="mode-btn" :class="{ active: mode === 'pin' }" @click="mode = 'pin'">PIN</button>
              </div>

              <!-- Password Display -->
              <div class="password-display">
                <input type="text" class="password-input" :value="password" readonly />
                <button class="icon-btn" @click="generate" title="Generate">🔄</button>
                <button class="icon-btn" @click="copyPassword" title="Copy">📋</button>
              </div>

              <!-- Random Mode Controls -->
              <div v-if="mode === 'random'">
                <div class="control-group">
                  <div class="control-row">
                    <span>Length: {{ randomLength }} characters</span>
                    <span>Entropy: {{ entropy.toFixed(1) }} bits</span>
                  </div>
                  <input type="range" v-model.number="randomLength" min="8" max="128" />
                </div>

                <div class="section-title">Character Types</div>
                <div class="checkbox-group">
                  <label class="checkbox-label">
                    <input type="checkbox" v-model="useUppercase" />
                    Uppercase (A-Z)
                  </label>
                  <label class="checkbox-label">
                    <input type="checkbox" v-model="useLowercase" />
                    Lowercase (a-z)
                  </label>
                  <label class="checkbox-label">
                    <input type="checkbox" v-model="useNumbers" />
                    Numbers (0-9)
                  </label>
                  <label class="checkbox-label">
                    <input type="checkbox" v-model="useSymbols" />
                    Symbols (!@#$...)
                  </label>
                </div>

                <label class="checkbox-label" style="margin-top: 10px;">
                  <input type="checkbox" v-model="excludeAmbiguous" />
                  Exclude ambiguous (0,O,l,1...)
                </label>
              </div>

              <!-- Passphrase Mode Controls -->
              <div v-if="mode === 'passphrase'">
                <div class="control-group">
                  <div class="control-row">
                    <span>Word Count: {{ wordCount }}</span>
                    <span>Entropy: {{ entropy.toFixed(1) }} bits</span>
                  </div>
                  <input type="range" v-model.number="wordCount" min="2" max="8" />
                </div>

                <label class="checkbox-label">
                  <input type="checkbox" v-model="capitalizeWords" />
                  Capitalize Words
                </label>

                <label class="checkbox-label" style="margin-top: 10px;">
                  <input type="checkbox" v-model="addNumber" />
                  Add Random Number
                </label>
              </div>

              <!-- PIN Mode Controls -->
              <div v-if="mode === 'pin'">
                <div class="control-group">
                  <div class="control-row">
                    <span>PIN Length: {{ pinLength }} digits</span>
                    <span>Entropy: {{ entropy.toFixed(1) }} bits</span>
                  </div>
                  <input type="range" v-model.number="pinLength" min="4" max="12" />
                </div>
              </div>

              <div class="button-group">
                <button class="btn btn-primary" @click="generate">Generate</button>
                <button class="btn btn-secondary" @click="copyPassword">Copy</button>
              </div>

              <!-- Strength Indicator -->
              <div class="strength-bar">
                <div class="strength-header">
                  <span>Password Strength</span>
                  <span>{{ strengthLabel }}</span>
                </div>
                <div class="strength-bg">
                  <div class="strength-fill" :style="{ width: strengthPercent + '%', background: strengthColor }"></div>
                </div>
              </div>

              <!-- Stats -->
              <div class="stats-grid">
                <div class="stat-card">
                  <div class="stat-value">{{ charset.length }}</div>
                  <div class="stat-label">Char Set Size</div>
                </div>
                <div class="stat-card">
                  <div class="stat-value">{{ (entropy / 10).toFixed(0) }}x</div>
                  <div class="stat-label">Crack Time</div>
                </div>
              </div>
            </div>

            <!-- History Panel -->
            <div class="card">
              <div class="header">
                <h2 class="title" style="margin: 0; background: none; -webkit-text-fill-color: unset; color: inherit;">📜 History</h2>
                <button class="icon-btn btn-small" @click="clearHistory" title="Clear History">🗑️</button>
              </div>

              <div v-if="passwordHistory.length === 0" style="text-align: center; opacity: 0.6; padding: 40px 0;">
                <p>No passwords generated yet</p>
              </div>

              <div v-else class="history-list">
                <div v-for="(item, index) in passwordHistory" :key="index" class="history-item">
                  <div class="history-password" :title="item.password">{{ item.password }}</div>
                  <span class="history-time">{{ formatTime(item.time) }}</span>
                  <button class="history-btn" @click="copyFromHistory(item.password)" title="Copy">📋</button>
                </div>
              </div>

              <div style="margin-top: 20px;">
                <div class="section-title">Quick Presets</div>
                <div class="button-group" style="flex-direction: column; gap: 8px;">
                  <button class="btn btn-secondary" @click="applyPreset('weak')" style="font-size: 12px; padding: 10px;">📌 Weak (8 chars, letters+numbers)</button>
                  <button class="btn btn-secondary" @click="applyPreset('medium')" style="font-size: 12px; padding: 10px;">🛡️ Medium (16 chars, all types)</button>
                  <button class="btn btn-secondary" @click="applyPreset('strong')" style="font-size: 12px; padding: 10px;">🔒 Strong (24 chars, all types)</button>
                  <button class="btn btn-secondary" @click="applyPreset('ultra')" style="font-size: 12px; padding: 10px;">⚡ Ultra (32 chars, all types)</button>
                </div>
              </div>

              <div style="margin-top: 20px;">
                <div class="section-title">Info</div>
                <div style="font-size: 12px; line-height: 1.6; opacity: 0.8;">
                  <p>✓ Uses Web Crypto API for secure generation</p>
                  <p>✓ Passwords stored locally in browser</p>
                  <p>✓ Entropy calculation for strength analysis</p>
                  <p>✓ Multiple generation modes available</p>
                </div>
              </div>
            </div>
          </div>

          <!-- Toast Notification -->
          <div v-if="toast" :class="['toast', toastType]">
            {{ toast }}
          </div>
        </div>
      `,

      setup() {
        // State
        const mode = ref('random');
        const password = ref('');
        const randomLength = ref(16);
        const wordCount = ref(3);
        const pinLength = ref(6);
        const entropy = ref(0);
        const passwordHistory = ref([]);
        const isDark = ref(true);
        const toast = ref('');
        const toastType = ref('success');

        // Checkboxes
        const useUppercase = ref(true);
        const useLowercase = ref(true);
        const useNumbers = ref(true);
        const useSymbols = ref(true);
        const excludeAmbiguous = ref(false);
        const capitalizeWords = ref(true);
        const addNumber = ref(true);

        // Word list for passphrase
        const wordList = [
          'ability', 'able', 'about', 'above', 'absent', 'absorb', 'abstract', 'academy', 'accent', 'accept',
          'access', 'accident', 'account', 'accuse', 'achieve', 'acid', 'acoustic', 'acquire', 'across', 'act',
          'action', 'actor', 'acts', 'actual', 'acute', 'adapt', 'add', 'addict', 'address', 'adjust',
          'admit', 'adobe', 'adopt', 'adore', 'adult', 'advance', 'advice', 'advise', 'affair', 'afford',
          'afraid', 'after', 'again', 'against', 'agency', 'agenda', 'agent', 'agree', 'ahead', 'aim',
          'air', 'alarm', 'album', 'album', 'alert', 'alien', 'align', 'alike', 'alive', 'all',
          'allow', 'alloy', 'allude', 'allure', 'ally', 'almanac', 'almost', 'alone', 'along', 'aloof',
          'aloud', 'alpha', 'already', 'also', 'altar', 'alter', 'always', 'amateur', 'amaze', 'amber',
          'ambiance', 'ambient', 'ambiguity', 'ambition', 'ambitious', 'amble', 'ambulance', 'amend', 'amenity', 'amid',
          'amigo', 'amiss', 'ammo', 'amok', 'among', 'amount', 'ample', 'amuse', 'amusing', 'anaconda'
        ];

        // Computed
        const charset = computed(() => {
          let cs = '';
          const upper = excludeAmbiguous.value ? 'ABCDEFGHJKLMNPQRSTUVWXYZ' : 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
          const lower = excludeAmbiguous.value ? 'abcdefghjkmnpqrstuvwxyz' : 'abcdefghijklmnopqrstuvwxyz';
          const nums = excludeAmbiguous.value ? '123456789' : '0123456789';
          const syms = '!@#$%^&*_+-=?';

          if (useUppercase.value) cs += upper;
          if (useLowercase.value) cs += lower;
          if (useNumbers.value) cs += nums;
          if (useSymbols.value) cs += syms;

          return cs;
        });

        const strengthPercent = computed(() => {
          if (entropy.value < 50) return 25;
          if (entropy.value < 100) return 50;
          if (entropy.value < 150) return 75;
          return 100;
        });

        const strengthColor = computed(() => {
          if (entropy.value < 50) return '#ef4444';
          if (entropy.value < 100) return '#f59e0b';
          if (entropy.value < 150) return '#22c55e';
          return '#10b981';
        });

        const strengthLabel = computed(() => {
          if (entropy.value < 50) return 'Weak';
          if (entropy.value < 100) return 'Fair';
          if (entropy.value < 150) return 'Good';
          return 'Strong';
        });

        // Methods
        const secureRandom = (max) => {
          const array = new Uint32Array(1);
          window.crypto.getRandomValues(array);
          return array[0] % max;
        };

        const generate = () => {
          if (mode.value === 'random') {
            generateRandom();
          } else if (mode.value === 'passphrase') {
            generatePassphrase();
          } else if (mode.value === 'pin') {
            generatePIN();
          }
        };

        const generateRandom = () => {
          if (!charset.value) {
            showToast('Select at least one character type', 'error');
            return;
          }

          let result = '';
          for (let i = 0; i < randomLength.value; i++) {
            result += charset.value[secureRandom(charset.value.length)];
          }

          password.value = result;
          entropy.value = randomLength.value * Math.log2(charset.value.length);
          addToHistory(result);
        };

        const generatePassphrase = () => {
          let words = [];
          for (let i = 0; i < wordCount.value; i++) {
            let word = wordList[secureRandom(wordList.length)];
            if (capitalizeWords.value) {
              word = word.charAt(0).toUpperCase() + word.slice(1);
            }
            words.push(word);
          }

          let result = words.join('-');
          if (addNumber.value) {
            result += secureRandom(100);
          }

          password.value = result;
          entropy.value = Math.log2(wordList.length) * wordCount.value + (addNumber.value ? Math.log2(100) : 0);
          addToHistory(result);
        };

        const generatePIN = () => {
          let result = '';
          for (let i = 0; i < pinLength.value; i++) {
            result += secureRandom(10);
          }

          password.value = result;
          entropy.value = pinLength.value * Math.log2(10);
          addToHistory(result);
        };

        const addToHistory = (pwd) => {
          passwordHistory.value.unshift({
            password: pwd,
            time: new Date()
          });
          if (passwordHistory.value.length > 20) {
            passwordHistory.value.pop();
          }
        };

        const copyPassword = async () => {
          if (!password.value) {
            showToast('Generate a password first', 'error');
            return;
          }
          try {
            await navigator.clipboard.writeText(password.value);
            showToast('Copied to clipboard ✓', 'success');
          } catch {
            showToast('Failed to copy', 'error');
          }
        };

        const copyFromHistory = async (pwd) => {
          try {
            await navigator.clipboard.writeText(pwd);
            showToast('Copied ✓', 'success');
          } catch {
            showToast('Failed to copy', 'error');
          }
        };

        const clearHistory = () => {
          if (confirm('Clear all password history?')) {
            passwordHistory.value = [];
            showToast('History cleared', 'success');
          }
        };

        const formatTime = (date) => {
          const now = new Date();
          const diff = now - date;
          const seconds = Math.floor(diff / 1000);
          const minutes = Math.floor(seconds / 60);
          const hours = Math.floor(minutes / 60);

          if (seconds < 60) return 'just now';
          if (minutes < 60) return `${minutes}m ago`;
          if (hours < 24) return `${hours}h ago`;
          return date.toLocaleDateString();
        };

        const showToast = (message, type = 'success') => {
          toast.value = message;
          toastType.value = type;
          setTimeout(() => {
            toast.value = '';
          }, 2000);
        };

        const toggleTheme = () => {
          isDark.value = !isDark.value;
          document.body.classList.toggle('light-mode', !isDark.value);
        };

        const applyPreset = (level) => {
          mode.value = 'random';
          useUppercase.value = true;
          useLowercase.value = true;
          useNumbers.value = true;
          useSymbols.value = true;
          excludeAmbiguous.value = false;

          if (level === 'weak') {
            randomLength.value = 8;
            useSymbols.value = false;
          } else if (level === 'medium') {
            randomLength.value = 16;
          } else if (level === 'strong') {
            randomLength.value = 24;
          } else if (level === 'ultra') {
            randomLength.value = 32;
          }

          setTimeout(() => generate(), 0);
        };

        onMounted(() => {
          document.body.classList.toggle('light-mode', !isDark.value);
          generate();
        });

        return {
          mode, password, randomLength, wordCount, pinLength, entropy,
          passwordHistory, isDark, toast, toastType,
          useUppercase, useLowercase, useNumbers, useSymbols,
          excludeAmbiguous, capitalizeWords, addNumber,
          charset, strengthPercent, strengthColor, strengthLabel,
          generate, copyPassword, copyFromHistory, clearHistory,
          formatTime, toggleTheme, applyPreset, showToast
        };
      }
    });

    app.mount('#app');
  </script>
</body>
</html>
