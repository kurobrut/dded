<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Modern Secure Password Generator</title>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
  background: linear-gradient(135deg, #0f172a 0%, #1e293b 25%, #0ea5e9 75%, #9333ea 100%);
  background-size: 400% 400%;
  animation: gradientMove 15s ease infinite;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 20px;
}

@keyframes gradientMove {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

.card {
  width: 100%;
  max-width: 500px;
  padding: 40px;
  border-radius: 32px;
  backdrop-filter: blur(40px);
  background: rgba(15, 23, 42, 0.7);
  border: 1px solid rgba(255, 255, 255, 0.12);
  box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
  color: white;
  display: flex;
  flex-direction: column;
  animation: slideUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
}

@keyframes slideUp {
  from { 
    opacity: 0; 
    transform: translateY(30px);
  }
  to { 
    opacity: 1; 
    transform: translateY(0);
  }
}

@media (max-width: 480px) {
  .card {
    padding: 28px;
    border-radius: 24px;
  }
}

h2 {
  text-align: center;
  margin: 0 0 28px 0;
  font-weight: 800;
  letter-spacing: -0.5px;
  font-size: 26px;
  background: linear-gradient(135deg, #fff 0%, #c7d2e0 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.password-display {
  position: relative;
  display: flex;
  gap: 10px;
  align-items: stretch;
  margin-bottom: 28px;
}

.password-input {
  flex: 1;
  padding: 16px 18px;
  border-radius: 14px;
  border: 1.5px solid rgba(255, 255, 255, 0.15);
  font-size: 15px;
  letter-spacing: 1.5px;
  outline: none;
  background: rgba(255, 255, 255, 0.08);
  color: white;
  font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
  transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

.password-input::placeholder {
  color: rgba(255, 255, 255, 0.4);
}

.password-input:focus {
  background: rgba(255, 255, 255, 0.12);
  border-color: rgba(59, 130, 246, 0.5);
  box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.2);
}

.icon-button {
  width: 48px;
  height: 48px;
  padding: 0;
  border-radius: 12px;
  border: 1.5px solid rgba(255, 255, 255, 0.15);
  background: linear-gradient(135deg, rgba(59, 130, 246, 0.2), rgba(59, 130, 246, 0.1));
  color: white;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  flex-shrink: 0;
  font-weight: 600;
}

.icon-button:hover {
  background: linear-gradient(135deg, rgba(59, 130, 246, 0.4), rgba(59, 130, 246, 0.25));
  border-color: rgba(59, 130, 246, 0.5);
  transform: translateY(-2px);
  box-shadow: 0 8px 16px rgba(59, 130, 246, 0.3);
}

.icon-button:active {
  transform: scale(0.95);
}

.preset-buttons {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 28px;
}

.preset-btn {
  padding: 12px 16px;
  border-radius: 11px;
  border: 1.5px solid rgba(255, 255, 255, 0.15);
  background: rgba(255, 255, 255, 0.06);
  color: white;
  cursor: pointer;
  font-size: 12px;
  font-weight: 600;
  transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  position: relative;
  overflow: hidden;
}

.preset-btn::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
  transform: translateX(-100%);
  transition: transform 0.3s;
}

.preset-btn:hover {
  background: rgba(255, 255, 255, 0.12);
  border-color: rgba(255, 255, 255, 0.3);
  transform: translateY(-2px);
  box-shadow: 0 6px 16px rgba(0, 0, 0, 0.3);
}

.preset-btn:hover::before {
  transform: translateX(100%);
}

.preset-btn:active {
  transform: scale(0.98);
}

.section {
  margin-bottom: 24px;
}

.section-title {
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1.2px;
  color: rgba(255, 255, 255, 0.5);
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.section-title::before {
  content: '';
  width: 3px;
  height: 3px;
  background: rgba(59, 130, 246, 0.8);
  border-radius: 50%;
}

.slider-container {
  margin-bottom: 20px;
}

.slider-label {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  margin-bottom: 12px;
  font-weight: 500;
  color: rgba(255, 255, 255, 0.85);
}

input[type="range"] {
  width: 100%;
  height: 7px;
  border-radius: 10px;
  background: linear-gradient(90deg, rgba(255, 255, 255, 0.1), rgba(59, 130, 246, 0.2));
  outline: none;
  -webkit-appearance: none;
  appearance: none;
}

input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: linear-gradient(135deg, #60a5fa, #3b82f6);
  cursor: pointer;
  box-shadow: 0 4px 12px rgba(59, 130, 246, 0.5), inset 0 1px 2px rgba(255, 255, 255, 0.3);
  border: 2px solid rgba(255, 255, 255, 0.15);
  transition: 0.2s;
}

input[type="range"]::-webkit-slider-thumb:hover {
  transform: scale(1.2);
  box-shadow: 0 8px 24px rgba(59, 130, 246, 0.6), inset 0 1px 2px rgba(255, 255, 255, 0.3);
}

input[type="range"]::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: linear-gradient(135deg, #60a5fa, #3b82f6);
  cursor: pointer;
  border: 2px solid rgba(255, 255, 255, 0.15);
  box-shadow: 0 4px 12px rgba(59, 130, 246, 0.5), inset 0 1px 2px rgba(255, 255, 255, 0.3);
  transition: 0.2s;
}

.checkbox-group {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}

@media (max-width: 420px) {
  .checkbox-group {
    grid-template-columns: 1fr;
  }
}

.checkbox-label {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 14px;
  cursor: pointer;
  padding: 12px;
  border-radius: 10px;
  transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  border: 1px solid rgba(255, 255, 255, 0.08);
  background: rgba(255, 255, 255, 0.04);
}

.checkbox-label:hover {
  background: rgba(59, 130, 246, 0.15);
  border-color: rgba(59, 130, 246, 0.3);
  transform: translateX(4px);
}

.checkbox-label input[type="checkbox"] {
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: #3b82f6;
  flex-shrink: 0;
}

.checkbox-label input[type="checkbox"]:hover {
  accent-color: #60a5fa;
}

.button-group {
  display: flex;
  gap: 12px;
  margin-bottom: 28px;
}

button.primary {
  flex: 1;
  padding: 14px 20px;
  border-radius: 12px;
  border: none;
  cursor: pointer;
  font-weight: 700;
  font-size: 14px;
  transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
  color: white;
  position: relative;
  overflow: hidden;
  letter-spacing: 0.3px;
}

button.primary::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
  transform: translateX(-100%);
  transition: transform 0.5s;
}

button.primary:hover {
  transform: translateY(-3px);
  box-shadow: 0 12px 28px rgba(34, 197, 94, 0.35);
}

button.primary:hover::before {
  transform: translateX(100%);
}

button.primary:active {
  transform: scale(0.97);
}

button.secondary {
  flex: 1;
  padding: 14px 20px;
  border-radius: 12px;
  border: none;
  cursor: pointer;
  font-weight: 700;
  font-size: 14px;
  transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
  color: white;
  position: relative;
  overflow: hidden;
  letter-spacing: 0.3px;
}

button.secondary::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
  transform: translateX(-100%);
  transition: transform 0.5s;
}

button.secondary:hover {
  transform: translateY(-3px);
  box-shadow: 0 12px 28px rgba(59, 130, 246, 0.35);
}

button.secondary:hover::before {
  transform: translateX(100%);
}

button.secondary:active {
  transform: scale(0.97);
}

.strength-container {
  margin-bottom: 28px;
  background: rgba(255, 255, 255, 0.05);
  padding: 16px;
  border-radius: 14px;
  border: 1px solid rgba(255, 255, 255, 0.08);
}

.strength-header {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  margin-bottom: 10px;
  font-weight: 600;
  color: rgba(255, 255, 255, 0.9);
}

.strength-bar-bg {
  height: 10px;
  border-radius: 20px;
  overflow: hidden;
  background: rgba(0, 0, 0, 0.2);
  margin-bottom: 10px;
  box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3);
}

.strength-bar {
  height: 100%;
  transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.6s ease;
  border-radius: 20px;
  position: relative;
  overflow: hidden;
}

.strength-bar::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
  animation: shimmer 2s infinite;
}

@keyframes shimmer {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(100%); }
}

.strength-label {
  font-size: 13px;
  font-weight: 700;
  opacity: 0.95;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.history {
  background: linear-gradient(135deg, rgba(59, 130, 246, 0.08), rgba(34, 197, 94, 0.08));
  border-radius: 14px;
  padding: 14px;
  font-size: 12px;
  max-height: 140px;
  overflow-y: auto;
  border: 1px solid rgba(255, 255, 255, 0.1);
}

.history-title {
  font-weight: 700;
  margin-bottom: 10px;
  opacity: 0.9;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: rgba(255, 255, 255, 0.8);
}

.history-item {
  padding: 7px 0;
  font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
  opacity: 0.75;
  word-break: break-all;
  animation: slideIn 0.4s ease;
  font-size: 11px;
  letter-spacing: 0.5px;
  color: rgba(255, 255, 255, 0.8);
}

@keyframes slideIn {
  from {
    opacity: 0;
    transform: translateX(-8px);
  }
  to {
    opacity: 1;
    transform: translateX(0);
  }
}

.toast {
  position: fixed;
  bottom: 30px;
  right: 30px;
  padding: 14px 20px;
  border-radius: 12px;
  backdrop-filter: blur(20px);
  border: 1px solid rgba(255, 255, 255, 0.2);
  font-size: 13px;
  font-weight: 600;
  animation: toastIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
}

@keyframes toastIn {
  from {
    opacity: 0;
    transform: translateY(20px) translateX(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0) translateX(0);
  }
}

@keyframes toastOut {
  from {
    opacity: 1;
    transform: translateY(0) translateX(0);
  }
  to {
    opacity: 0;
    transform: translateY(10px) translateX(20px);
  }
}

.toast.success {
  background: linear-gradient(135deg, rgba(34, 197, 94, 0.2), rgba(34, 197, 94, 0.1));
  border-color: rgba(34, 197, 94, 0.4);
  color: #86efac;
}

.toast.error {
  background: linear-gradient(135deg, rgba(239, 68, 68, 0.2), rgba(239, 68, 68, 0.1));
  border-color: rgba(239, 68, 68, 0.4);
  color: #fca5a5;
}

.toast.out {
  animation: toastOut 0.3s ease forwards;
}

@media (max-width: 480px) {
  .toast {
    bottom: 20px;
    right: 20px;
    left: 20px;
  }
}

::-webkit-scrollbar {
  width: 6px;
}

::-webkit-scrollbar-track {
  background: rgba(255, 255, 255, 0.05);
  border-radius: 10px;
}

::-webkit-scrollbar-thumb {
  background: rgba(255, 255, 255, 0.2);
  border-radius: 10px;
}

::-webkit-scrollbar-thumb:hover {
  background: rgba(255, 255, 255, 0.4);
}
</style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">

function App() {
  const [length, setLength] = React.useState(16);
  const [password, setPassword] = React.useState("");
  const [entropy, setEntropy] = React.useState(0);
  const [history, setHistory] = React.useState([]);
  const [toast, setToast] = React.useState("");
  const [toastType, setToastType] = React.useState("");

  const [useUpper, setUseUpper] = React.useState(true);
  const [useLower, setUseLower] = React.useState(true);
  const [useNumbers, setUseNumbers] = React.useState(true);
  const [useSymbols, setUseSymbols] = React.useState(true);
  const [excludeAmbiguous, setExcludeAmbiguous] = React.useState(false);

  const upper = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
  const upperAmbiguous = "ABCDEFGHJKLMNPQRSTUVWXYZ";
  
  const lower = "abcdefghijklmnopqrstuvwxyz";
  const lowerAmbiguous = "abcdefghjkmnpqrstuvwxyz";
  
  const numbers = "0123456789";
  const numbersAmbiguous = "123456789";
  
  const symbols = "!@#$%^&*_+-=?";

  const showToast = (message, type = "success", duration = 2000) => {
    setToast(message);
    setToastType(type);
    setTimeout(() => {
      setToast("");
    }, duration);
  };

  const secureRandom = (max) => {
    const array = new Uint32Array(1);
    window.crypto.getRandomValues(array);
    return array[0] % max;
  };

  const generatePassword = () => {
    let charset = "";
    let required = [];

    const upperSet = excludeAmbiguous ? upperAmbiguous : upper;
    const lowerSet = excludeAmbiguous ? lowerAmbiguous : lower;
    const numberSet = excludeAmbiguous ? numbersAmbiguous : numbers;

    if (useUpper) { 
      charset += upperSet; 
      required.push(upperSet[secureRandom(upperSet.length)]); 
    }
    if (useLower) { 
      charset += lowerSet; 
      required.push(lowerSet[secureRandom(lowerSet.length)]); 
    }
    if (useNumbers) { 
      charset += numberSet; 
      required.push(numberSet[secureRandom(numberSet.length)]); 
    }
    if (useSymbols) { 
      charset += symbols; 
      required.push(symbols[secureRandom(symbols.length)]); 
    }

    if (!charset) {
      showToast("Select at least one option", "error");
      return;
    }

    let result = [...required];

    for (let i = result.length; i < length; i++) {
      result.push(charset[secureRandom(charset.length)]);
    }

    for (let i = result.length - 1; i > 0; i--) {
      const j = secureRandom(i + 1);
      [result[i], result[j]] = [result[j], result[i]];
    }

    const finalPassword = result.join("");
    const totalEntropy = length * Math.log2(charset.length);

    setPassword(finalPassword);
    setEntropy(totalEntropy);
    setHistory([finalPassword, ...history.slice(0, 4)]);
  };

  const applyPreset = (len, upper, lower, numbers, symbols) => {
    setLength(len);
    setUseUpper(upper);
    setUseLower(lower);
    setUseNumbers(numbers);
    setUseSymbols(symbols);
    setTimeout(() => {
      let charset = "";
      const upperSet = excludeAmbiguous ? "ABCDEFGHJKLMNPQRSTUVWXYZ" : "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
      const lowerSet = excludeAmbiguous ? "abcdefghjkmnpqrstuvwxyz" : "abcdefghijklmnopqrstuvwxyz";
      const numberSet = excludeAmbiguous ? "123456789" : "0123456789";
      
      if (upper) charset += upperSet;
      if (lower) charset += lowerSet;
      if (numbers) charset += numberSet;
      if (symbols) charset += "!@#$%^&*_+-=?";
      
      if (!charset) return;
      
      const mockLength = len;
      const mockEntropy = mockLength * Math.log2(charset.length);
      setEntropy(mockEntropy);
    }, 0);
  };

  const copyPassword = async () => {
    if (!password) {
      showToast("Generate a password first", "error");
      return;
    }
    try {
      await navigator.clipboard.writeText(password);
      showToast("Copied to clipboard ✓", "success");
    } catch {
      showToast("Failed to copy", "error");
    }
  };

  const handleKeyPress = (e) => {
    if (e.key === "Enter") {
      generatePassword();
    }
  };

  const strengthPercent = Math.min((entropy / 200) * 100, 100);
  const strengthColor =
    entropy < 50 ? "#ef4444" :
    entropy < 100 ? "#f59e0b" :
    entropy < 150 ? "#22c55e" :
    "#10b981";

  const strengthLabel =
    entropy < 50 ? "Weak" :
    entropy < 100 ? "Fair" :
    entropy < 150 ? "Good" :
    "Strong";

  return (
    <div className="card">
      <h2>🔐 Password Generator</h2>

      <div className="password-display">
        <input 
          type="text" 
          className="password-input"
          value={password} 
          readOnly 
          placeholder="Generate a password..."
          onKeyPress={handleKeyPress}
        />
        <button className="icon-button" onClick={generatePassword} title="Regenerate (Enter)" aria-label="Regenerate password">
          🔄
        </button>
        <button className="icon-button" onClick={copyPassword} title="Copy" aria-label="Copy to clipboard">
          📋
        </button>
      </div>

      <div className="preset-buttons">
        <button className="preset-btn" onClick={() => applyPreset(12, true, true, false, false)}>Light</button>
        <button className="preset-btn" onClick={() => applyPreset(16, true, true, true, false)}>Standard</button>
        <button className="preset-btn" onClick={() => applyPreset(20, true, true, true, true)}>Strong</button>
      </div>

      <div className="section">
        <div className="section-title">Length & Complexity</div>
        <div className="slider-container">
          <div className="slider-label">
            <label htmlFor="length-slider">Password Length</label>
            <span>{length} chars</span>
          </div>
          <input
            id="length-slider"
            type="range"
            min="8"
            max="32"
            value={length}
            onChange={e => setLength(Number(e.target.value))}
            aria-label="Password length"
          />
        </div>
      </div>

      <div className="section">
        <div className="section-title">Character Types</div>
        <div className="checkbox-group">
          <label className="checkbox-label">
            <input type="checkbox" checked={useUpper} onChange={() => setUseUpper(!useUpper)} aria-label="Include uppercase letters" />
            Uppercase
          </label>
          <label className="checkbox-label">
            <input type="checkbox" checked={useLower} onChange={() => setUseLower(!useLower)} aria-label="Include lowercase letters" />
            Lowercase
          </label>
          <label className="checkbox-label">
            <input type="checkbox" checked={useNumbers} onChange={() => setUseNumbers(!useNumbers)} aria-label="Include numbers" />
            Numbers
          </label>
          <label className="checkbox-label">
            <input type="checkbox" checked={useSymbols} onChange={() => setUseSymbols(!useSymbols)} aria-label="Include symbols" />
            Symbols
          </label>
        </div>
      </div>

      <div className="section">
        <label className="checkbox-label">
          <input type="checkbox" checked={excludeAmbiguous} onChange={() => setExcludeAmbiguous(!excludeAmbiguous)} aria-label="Exclude ambiguous characters" />
          Exclude ambiguous (0, O, l, 1, etc.)
        </label>
      </div>

      <div className="button-group">
        <button className="primary" onClick={generatePassword}>Generate</button>
        <button className="secondary" onClick={copyPassword}>Copy</button>
      </div>

      <div className="strength-container">
        <div className="strength-header">
          <span>Strength</span>
          <span>{entropy.toFixed(1)} bits</span>
        </div>
        <div className="strength-bar-bg">
          <div
            className="strength-bar"
            style={{
              width: strengthPercent + "%",
              background: strengthColor
            }}
          />
        </div>
        <div className="strength-label" style={{ color: strengthColor }}>
          {strengthLabel}
        </div>
      </div>

      {history.length > 0 && (
        <div className="history">
          <div className="history-title">Recent Passwords</div>
          {history.map((item, index) => (
            <div key={index} className="history-item">{item}</div>
          ))}
        </div>
      )}

      {toast && (
        <div className={`toast ${toastType}`}>
          {toast}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>
